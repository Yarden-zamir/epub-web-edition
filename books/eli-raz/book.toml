"p200-x794" = "מכתב מודפס על נייר של ראש הממשלה (The Prime Minister), ירושלים, ח' באב תשנ\"ג, 26 ביולי 1993, אל צוות עין גדי. נוסח המכתב: ידידים יקרים, מקריאה בעיתונים אני למד על יזמתכם והחלצותכם בהתנדבות לעזרתם של מטיילים במדבר יהודה אשר נקלעו למצוקה. למדתי על החוויות הקשות שעוברות עליכם, על אומץ הלב, על המאמץ. אהיה לפה לרבים מאתנו אם אודה לכם על כל שאתם עושים, על הסיכון שאתם נוטלים על עצמכם, על הדבקות במשימה, על הצלתן של נפשות – ועל הרגעים המרים. הצוות שלכם מגלם את פניה היפות של מדינת ישראל. תודה מעומק הלב. חתום: יצחק רבין."
