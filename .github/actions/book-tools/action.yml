# The tools that books/eli-raz/scripts/check.py needs: EPUBCheck, a Java runtime and axe-core in .tools/ (pinned and
# checked), uv 0.13.6, and the Chromium of Playwright 1.64.1. Each one comes from the Actions cache when it can.
name: book tools
description: Pinned tools for the Eli Raz book checks
runs:
  using: composite
  steps:
    - name: Restore tool downloads
      id: tools
      uses: actions/cache@v6
      with:
        path: .tools
        key: tools-jre-21.0.13.1+2-epubcheck-5.4.0-axe-4.14.0
    - name: Download tools
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .tools/dl
        cd .tools
        curl -fsSL -o dl/jre.tgz https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jre_x64_linux_hotspot_21.0.13.1_2.tar.gz
        curl -fsSL -o dl/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
        curl -fsSL -o dl/axe.tgz https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz
        sha256sum -c - <<'SUMS'
        18f44fab9065217f3ba61d0eef8a7b5f3c3713aa7293001b0d4ac10ede3850f0  dl/jre.tgz
        33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  dl/epubcheck.zip
        2277b0a3ef47af9b52497faa3e71598e86e0a0e5e6eb295207a5657ede4709af  dl/axe.tgz
        SUMS
        tar -xzf dl/jre.tgz
        unzip -q dl/epubcheck.zip
        mkdir axe
        tar -xzf dl/axe.tgz -C axe
        rm -r dl

    - name: Install uv 0.13.6
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Restore uv cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv/python
        key: uv-0.13.6-${{ hashFiles('tools/*.py', 'tools/web/*.py', 'books/eli-raz/scripts/*.py') }}
        restore-keys: uv-0.13.6-
    - name: Restore Playwright browser
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-1.64.1-chromium-headless-shell
    # No --with-deps (about 10 s of apt): the runner image ships Chrome and its libraries. A missing library fails
    # the smoke test loudly; then add --with-deps back.
    - name: Install Playwright browser
      shell: bash
      run: uv run --with playwright==1.64.1 playwright install --only-shell chromium
