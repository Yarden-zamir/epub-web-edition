# Every check of the Eli Raz edition, on GitHub's machines, for a lane branch before it lands on main. It deploys
# nothing; main's kitshn.yml stays the deploy gate. A lane pushes here with books/eli-raz/scripts/lane_push.py.
# One billed job runs the checks as parallel processes (each job is billed in whole minutes). Videos and traces cost
# a second job, so they run only when the pushed commit message holds "[record]" or a manual run asks for them
# (lane_push.py --record).
# The jobs run on the runner that the repo variable CHECKS_RUNNER names (default ubuntu-latest), so a self-hosted
# runner can take them without a change here.
name: checks
on:
  push:
    branches: ["lane/**"]
  workflow_dispatch:
    inputs:
      record:
        description: Also record videos, traces, screenshots and load timings
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to the same lane makes the running checks obsolete.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  ELI_RAZ_INGEST_KEEP: "2"
jobs:
  check:
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ingest outputs by input hash, EPUBs that passed EPUBCheck, sections that passed axe (main's runs save it too).
      - name: Restore check cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/eli-raz
          key: eli-raz-cache-${{ github.run_id }}
          restore-keys: eli-raz-cache-
      - uses: ./.github/actions/book-tools
      # Build, then EPUBCheck, axe on the whole page at every width and scheme, the explainers and the sample edition
      # at the same time.
      # Advisory for now: the sample edition (tools/verify.py) fails "'/' opens search and Enter goes to the first
      # hit" and times out clicking "#fig-01-01 img" (run 45442257445). It warns and does not block. Make it blocking
      # again (remove --advisory sample) once the UI lane fixes both.
      - name: Ingest, build, check_release, EPUBCheck, full axe, explainers, sample edition
        run: >-
          uv run books/eli-raz/scripts/check.py --ingest --compare-ingest
          --epubcheck --axe-full --explorables --sample --advisory sample
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: book-check
          path: |
            books/eli-raz/dist/release
            books/eli-raz/dist/explorables
            dist/verify
          if-no-files-found: warn
          retention-days: 2

  review:
    needs: check
    if: contains(github.event.head_commit.message, '[record]') || inputs.record
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: book-check
          path: .
      - uses: ./.github/actions/book-tools
      - name: Videos, traces, screenshots and load timings
        run: uv run books/eli-raz/scripts/check.py --no-build --record
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: book-record
          path: books/eli-raz/dist/record
          if-no-files-found: warn
          retention-days: 2
