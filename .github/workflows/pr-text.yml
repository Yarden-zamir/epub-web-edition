# Checks the text of a pull request on each edit and push: the "### Decisions" block and no PLAN.md in a ready PR
# (scripts/check-pr-text.sh). Its own workflow, so that an edit of the text reruns only this check, not check.yml. The merge
# queue checks the text again (check.yml). Pattern: game-design-driven/cosmoteer-hot-cargo pr-text.yml at aa64aea.
name: pr-text
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/check-pr-text.sh "$PR"
