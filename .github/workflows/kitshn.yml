# Deploy both apps of kitshn.config.ts: the sample edition (built in the deploy job) and the Eli Raz edition
# (built in the "book" job). To build and deploy by hand: gh workflow run kitshn.yml -R game-design-driven/epub-web-edition
on:
  # main moves only through the merge queue (docs/WORKFLOW.md); each push to main is a tested commit.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  book:
    # The book deploys only from main (kitshn.config.ts), so other branches and pull requests skip its build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A web build that passed the checks is kept under the hash of everything the book build reads. A push that
      # changes none of it (a sample-only change) restores that build and skips the rest. The cache saves only after
      # all steps passed. Known limit: the list of inputs is kept by hand; revisit it when the build reads new files.
      - name: Restore checked web build
        id: web
        uses: actions/cache@v6
        with:
          path: books/eli-raz/dist/release/web
          key: book-web-${{ hashFiles('books/eli-raz/**', 'tools/**', 'site/**', 'epub-src/OEBPS/fonts/**', 'epub-src/OEBPS/css/**', '.github/workflows/kitshn.yml', '.github/actions/book-tools/action.yml') }}
      # The shared cache of check.py: ingest outputs by input hash, EPUBs that passed EPUBCheck, sections that
      # passed axe. check.yml saves into it too.
      - name: Restore check cache
        if: steps.web.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/eli-raz
          key: eli-raz-cache-${{ github.run_id }}
          restore-keys: eli-raz-cache-
      - name: Tools
        if: steps.web.outputs.cache-hit != 'true'
        uses: ./.github/actions/book-tools
      # The deploy gate (check.py --gate): ingest, build, check_release with the size budget, EPUBCheck, and the quick
      # smoke test. The merge queue ran every check on this commit before it reached main (check.yml).
      - name: Build and check
        if: steps.web.outputs.cache-hit != 'true'
        env:
          ELI_RAZ_INGEST_KEEP: "2"
        run: uv run books/eli-raz/scripts/check.py --gate
      - name: Shrink uv cache
        if: steps.web.outputs.cache-hit != 'true'
        run: uv cache prune --ci
      # One day is enough: the deploy job of the same run downloads it.
      - uses: actions/upload-artifact@v7
        with:
          name: book-web
          path: books/eli-raz/dist/release/web
          if-no-files-found: error
          retention-days: 1
      # Workaround: download-artifact v8 extracts a run's only artifact flat into its path, not into a folder with its
      # name, and then kitshn2-deploy.yml cannot find "book-web". A second artifact keeps one folder per artifact.
      # Remove it when kitshn2-deploy.yml handles a single artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: book-build-json
          path: books/eli-raz/dist/release/web/build.json
          if-no-files-found: error
          retention-days: 1

  kitshn:
    needs: book
    # A skipped book build (pull requests, other branches) still deploys the sample. A failed one deploys nothing,
    # so both live sites stay as they were.
    if: ${{ !cancelled() && !failure() }}
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    with:
      artifacts: ${{ needs.book.result == 'success' && '{"book":{"name":"book-web","path":"books/eli-raz/dist/release/web"}}' || '' }}
    secrets: inherit
