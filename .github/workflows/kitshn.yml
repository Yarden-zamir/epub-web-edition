# Deploy both apps of kitshn.config.ts: the sample edition (built in the deploy job) and the Eli Raz edition
# (built in the "book" job). To build and deploy by hand: gh workflow run kitshn.yml -R Yarden-zamir/epub-web-edition
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  book:
    # The book deploys only from main (kitshn.config.ts), so other branches and pull requests skip its build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A web build that passed every check is kept under the hash of everything the book build reads. A push that
      # changes none of it (a sample-only change) restores that build and skips the rest. The cache saves only after
      # all steps passed. Known limit: the list of inputs is kept by hand; revisit it when the build reads new files.
      - name: Restore checked web build
        id: web
        uses: actions/cache@v6
        with:
          path: books/eli-raz/dist/release/web
          key: book-web-${{ hashFiles('books/eli-raz/**', 'tools/**', 'site/**', 'epub-src/OEBPS/fonts/**', 'epub-src/OEBPS/css/**', '.github/workflows/kitshn.yml') }}
      # Ingest outputs; build_release.py runs ingest only when work/ingest-key differs from the hash of its inputs.
      - name: Restore ingest output
        if: steps.web.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            books/eli-raz/epub-src
            books/eli-raz/epub-src-release
            books/eli-raz/work/ingest-key
          key: ingest-${{ github.sha }}
          restore-keys: ingest-

      # The layout of .tools is the one that books/eli-raz/scripts/build_release.py reads.
      - name: Restore tool downloads
        if: steps.web.outputs.cache-hit != 'true'
        id: tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-jre-21.0.13.1+2-epubcheck-5.4.0-axe-4.14.0
      - name: Download tools
        if: steps.web.outputs.cache-hit != 'true' && steps.tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .tools/dl
          cd .tools
          curl -fsSL -o dl/jre.tgz https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13.1%2B2/OpenJDK21U-jre_x64_linux_hotspot_21.0.13.1_2.tar.gz
          curl -fsSL -o dl/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          curl -fsSL -o dl/axe.tgz https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz
          sha256sum -c - <<'SUMS'
          18f44fab9065217f3ba61d0eef8a7b5f3c3713aa7293001b0d4ac10ede3850f0  dl/jre.tgz
          33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  dl/epubcheck.zip
          2277b0a3ef47af9b52497faa3e71598e86e0a0e5e6eb295207a5657ede4709af  dl/axe.tgz
          SUMS
          tar -xzf dl/jre.tgz
          unzip -q dl/epubcheck.zip
          mkdir axe
          tar -xzf dl/axe.tgz -C axe
          rm -r dl

      - name: Install uv 0.13.6
        if: steps.web.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore uv cache
        if: steps.web.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/python
          key: uv-0.13.6-${{ hashFiles('tools/*.py', 'books/eli-raz/scripts/*.py') }}
          restore-keys: uv-0.13.6-
      - name: Restore Playwright browser
        if: steps.web.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium-headless-shell
      - name: Install Playwright browser
        if: steps.web.outputs.cache-hit != 'true'
        # No --with-deps (about 10 s of apt): the runner image ships Chrome and its libraries. A missing library fails
        # the smoke test loudly; then add --with-deps back.
        run: uv run --with playwright==1.64.1 playwright install --only-shell chromium

      - name: Build and check
        if: steps.web.outputs.cache-hit != 'true'
        run: uv run books/eli-raz/scripts/build_release.py
      - name: Shrink uv cache
        if: steps.web.outputs.cache-hit != 'true'
        run: uv cache prune --ci
      # Artifact storage of a private repo counts against the account quota, so keep each run's files one day.
      - uses: actions/upload-artifact@v7
        with:
          name: book-web
          path: books/eli-raz/dist/release/web
          if-no-files-found: error
          retention-days: 1
      # Workaround: download-artifact v8 extracts a run's only artifact flat into its path, not into a folder with its
      # name, and then kitshn2-deploy.yml cannot find "book-web". A second artifact keeps one folder per artifact.
      # Remove it when kitshn2-deploy.yml handles a single artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: book-build-json
          path: books/eli-raz/dist/release/web/build.json
          if-no-files-found: error
          retention-days: 1

  kitshn:
    needs: book
    # A skipped book build (pull requests, other branches) still deploys the sample. A failed one deploys nothing,
    # so both live sites stay as they were.
    if: ${{ !cancelled() && !failure() }}
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    with:
      artifacts: ${{ needs.book.result == 'success' && '{"book":{"name":"book-web","path":"books/eli-raz/dist/release/web"}}' || '' }}
    secrets: inherit
