# Private book configuration for tools/ingest_pdf.py in the epub-web-edition pipeline.
# Every value here comes from the source PDF. The comments name where.

pdf = "~/private-inputs/eli-raz/source-2026-11-23/source.pdf"
pdf_sha256 = "c7efc94efd4cbd42bf9d479a20ff1af763e017ec0ce1cfab75d2be7e3560e994"
# Ornaments that are not book content. Checked visually on PDF pages 6-7.
decorative = ["p006-x17", "p007-x21"]

# Wrong code points in the PDF text layer, mapped to what the print shows.
# U+0007: InDesign "indent to here" after note and source numbers (130 cases). Prints as a space.
# U+001A: a zero-width glyph under ayin in "מעין" (PDF pages 210, 211). The render shows a shva.
# U+FFFD: one FrankRuhlMFBold glyph without a character code (PDF page 70, "הקַשָרים"); the only one in the PDF. The render shows a patach under ק.
# Note references that print as full-size digits. Each one is restored as a reference and logged.
[[note_ref_fix]]
page = 23
contains = "1.42 meters.3"
number = 3
reason = "Print sets reference 3 as a full-size digit (typesetting slip). Note 3 exists at the page foot."

# Bracket order in mixed Hebrew and Latin lines. The PDF stores brackets differently in Hebrew and Latin
# fonts, so the extracted order can be wrong. Each fix was checked against a render of the printed line.

# Text left out on purpose. Each entry is logged as an intentional change.
[[omit]]
page = 22
contains = "The English text continues from the left page"
reason = "Print-only reading note for the two-page spreads. The EPUB puts the English pages in reading order, so the note would mislead."

[char_map]
"\u0007" = " "
"\u001a" = "\u05b0"
"\ufffd" = "\u05b7"

