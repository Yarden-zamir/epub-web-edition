[cover]
# The EPUB cover-image (library thumbnail) is a render of the full printed cover: photo plus typography.
# Derived image. The cover page in the spine keeps the real cover text and the original photo.
render_page = 1
height_px = 1600

[facsimile]
# Appendix with a page image of every PDF page, one document per page, with a Return link to the text.
# Derived images, rendered from source.pdf. They are not scans of paper.
dpi = 64  # 428x604 px per page, about v3 size. Keeps the EPUB under the 25 MB per-file limit of the web host.
quality = 60
title = "עמודי המקור"
note = "תוספת של מהדורה זו: תמונות של כל עמודי הספר המודפס, כפי שהם מופיעים בקובץ הדפוס. הן נועדו להשוואה עם הטקסט. בכל עמוד יש קישור חזרה למקום המתאים בטקסט."
return_label = "חזרה לטקסט"
page_label = "עמוד"

[assets]
css = "book.css"     # Font stacks name the print fonts first; see the comment in the file.
