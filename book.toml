# Private book configuration for tools/ingest_pdf.py in the epub-web-edition pipeline.
# Every value here comes from the source PDF. The comments name where.

pdf = "~/private-inputs/eli-raz/source-2026-11-23/source.pdf"
pdf_sha256 = "c7efc94efd4cbd42bf9d479a20ff1af763e017ec0ce1cfab75d2be7e3560e994"
# Ornaments that are not book content. Checked visually on PDF pages 6-7.
decorative = ["p006-x17", "p007-x21"]

# Wrong code points in the PDF text layer, mapped to what the print shows.
# U+0007: InDesign "indent to here" after note and source numbers (130 cases). Prints as a space.
# U+001A: a zero-width glyph under ayin in "מעין" (PDF pages 210, 211). The render shows a shva.
# Note references that print as full-size digits. Each one is restored as a reference and logged.
[[note_ref_fix]]
page = 23
contains = "1.42 meters.3"
number = 3
reason = "Print sets reference 3 as a full-size digit (typesetting slip). Note 3 exists at the page foot."

# Text left out on purpose. Each entry is logged as an intentional change.
[[omit]]
page = 22
contains = "The English text continues from the left page"
reason = "Print-only reading note for the two-page spreads. The EPUB puts the English pages in reading order, so the note would mislead."

[char_map]
"\u0007" = " "
"\u001a" = "\u05b0"

[meta]
# As printed on the title page (PDF page 5) and the cover (PDF page 1).
identifier = "urn:uuid:9b1e6f8a-5c3d-4e2a-9f71-2d4b8c6a1e05"  # New identifier for this edition.
title = "אלי רז חוקר הבולענים"  # Two lines on the title page, joined with a space. No punctuation in print.
creators = ["אלי רז"]
editor = "יאיר גלעדי"
description = "מאמרים, חוויות וסיפורים מהמקצוע ומהחיים"  # Cover text layer, PDF page 1, two lines joined.
language = "he"
source = "urn:isbn:978-965-596-043-3"  # Title page, PDF page 5.
rights = "© כל הזכויות שמורות"  # Title page, PDF page 5. Full rights text stays in the book body.

[layout]
# Printed page number = PDF page - 4 (PDF page 14 prints "10", PDF page 22 prints "18").
folio_offset = 4
folio_font = "Extrim"
header_max_y = 0.15      # Running heads and folios sit above this share of the page height.
# Only these fonts count as running heads or folios in that band. Other text there is content (PDF page 308 has a title there).
running_head_fonts = [["Extrim", 12.0], ["FbTubic", 9.8]]
footnote_min_y = 0.62    # Small notes below this share of the height are footnotes.
indent_tolerance = 6.0   # Points. A line this far in from the column edge starts a paragraph.
short_tolerance = 20.0   # Points. A line that ends this far short of the far edge ends a paragraph.
caption_gap = 30.0       # Points between an image edge and a caption line.
credit_prefixes = ["צילום", "צלם", "צילומים", "באדיבות", "Photo", "Courtesy", "Source", "מקור"]

# Text roles by font. The first rule that matches the font name part and size range wins.
[[role]]
font = "Extrim"
min = 33.0
role = "display"
[[role]]
font = "Extrim"
min = 19.0
role = "title"
[[role]]
font = "FbMonopoly-Regular"
min = 19.0
role = "title"
[[role]]
font = "Extrim"
min = 13.5
max = 15.5
role = "byline"
[[role]]
font = "FbMonopoly-Regular"
min = 13.5
max = 15.5
role = "byline"
[[role]]
font = "FbMonopoly-Medium"
role = "subheading"
[[role]]
font = "AlmoniDLAAA"
max = 11.6
role = "small"

